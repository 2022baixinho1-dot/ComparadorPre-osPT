name: Testar Scraper de Folhetos - Pingo Doce

on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Descarregar o código do repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar o Tesseract (motor de OCR) + pacote de português
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por

      - name: Instalar dependências Python
        run: pip install -r folhetos/pingodoce/requirements.txt

      - name: Correr o scraper (com OCR)
        run: python folhetos/pingodoce/scraper_pingodoce.py
