name: Comparar Preços - Folhetos

on:
  workflow_dispatch:
 

permissions:
  contents: write

jobs:
  comparar:
    runs-on: ubuntu-latest
    steps:
      - name: Descarregar o código do repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r folhetos/requirements-comparacao.txt

      - name: Correr a comparação
        run: python folhetos/comparar.py

      - name: Guardar o resultado no repositório (commit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add folhetos/dados/comparacao/
          git diff --staged --quiet || git commit -m "Atualiza comparação de preços entre folhetos"
          git push
