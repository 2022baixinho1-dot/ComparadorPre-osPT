name: Folheto Pingo Doce - Lojas Grandes

on:
  schedule:
    - cron: "0 6 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por

      - name: Install Python dependencies
        run: pip install -r folhetos/pingodoce/requirements.txt

      - name: Run scraper
        run: python folhetos/pingodoce/main_pingodoce.py

      - name: Commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add folhetos/dados/pingodoce
          if git diff --cached --quiet; then
            echo "Sem alterações para commit."
          else
            git commit -m "Atualiza folheto Pingo Doce Lojas Grandes"
            git push
          fi
